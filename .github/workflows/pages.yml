name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

# Publishes the static demo to the gh-pages branch. GitHub Pages must be set to
# "Deploy from a branch -> gh-pages -> / (root)" once in repository settings;
# creating the Pages site itself is not permitted to the Actions token here.
permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build static demo (on-device only; server API routes removed)
        run: |
          rm -rf app/api
          STATIC_EXPORT=1 NEXT_PUBLIC_BASE_PATH=/visa-readiness npx next build
          touch out/.nojekyll
      - name: Publish to gh-pages
        run: |
          cd out
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Deploy ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}" gh-pages
